name: Release Fission Server

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      description:
        description: Release description
        required: false
        type: string
        default: ""
      draft:
        description: Create as a draft release
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark as a pre-release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize all runs for the same requested tag, including runs dispatched from different refs.
  group: release-fission-server-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: fission-server-linux-x86_64
            artifact_filename: fission-server-linux-x86_64
            configure_args: -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            binary_path: build/Fission.Server
            install_deps: sudo apt-get update && sudo apt-get install -y ninja-build
            setup_windows_toolchain: false
            configure_shell: bash
            version_ref: "$FISSION_VERSION"

          - os: windows-latest
            artifact: fission-server-windows-x86_64
            artifact_filename: fission-server-windows-x86_64.exe
            configure_args: -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            binary_path: build/Fission.Server.exe
            install_deps: echo "Using preinstalled LLVM/Clang toolchain"
            setup_windows_toolchain: true
            configure_shell: pwsh
            version_ref: "$env:FISSION_VERSION"

          - os: macos-15
            artifact: fission-server-macos-arm64
            artifact_filename: fission-server-macos-arm64
            configure_args: -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
            binary_path: build/Fission.Server
            install_deps: brew install ninja
            setup_windows_toolchain: false
            configure_shell: bash
            version_ref: "$FISSION_VERSION"

          - os: macos-15-intel
            artifact: fission-server-macos-x86_64
            artifact_filename: fission-server-macos-x86_64
            configure_args: -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
            binary_path: build/Fission.Server
            install_deps: brew install ninja
            setup_windows_toolchain: false
            configure_shell: bash
            version_ref: "$FISSION_VERSION"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate release tag
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ inputs.tag }}

      - name: Install build dependencies
        run: ${{ matrix.install_deps }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"

      - name: Setup Windows toolchain
        if: matrix.setup_windows_toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: ${{ matrix.configure_shell }}
        env:
          FISSION_VERSION: ${{ inputs.tag }}
        run: cmake -S . -B build -DBUILD_TESTING=OFF -DUSE_CCACHE=OFF "-DFISSION_VERSION=${{ matrix.version_ref }}" ${{ matrix.configure_args }}

      - name: Build
        run: cmake --build build --config Release --target Fission.Server.CLI --parallel

      - name: Smoke test Linux server
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./build/Fission.Server --port 18080 >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/health | grep --quiet '"ok":true'; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.artifact_filename }}"
          chmod +x dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fission-server-*
          merge-multiple: true
          path: dist

      - name: List release assets
        run: ls -lh dist

      # Re-check immediately before publication: an existing tag may have moved after the build.
      - name: Validate release tag
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ inputs.tag }}

      # Query the remote tag again because the checkout snapshot may predate a tag move. Repository
      # tag rulesets must also prevent updates/deletion; this check catches movement before
      # publication but cannot make the tag immutable atomically.
      - name: Verify remote release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/git"
          fetch_ref() {
            curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$1"
          }

          encoded_tag=$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')
          status=$(fetch_ref "$api/ref/tags/${encoded_tag}")
          if [[ "$status" == "404" ]]; then
            echo "Tag $RELEASE_TAG does not exist yet; it will be created at $GITHUB_SHA."
            exit 0
          fi
          if [[ "$status" != "200" ]]; then
            echo "::error::Could not verify tag $RELEASE_TAG (HTTP $status)."
            cat "$response_file"
            exit 1
          fi

          object_sha=$(jq -r '.object.sha' "$response_file")
          object_type=$(jq -r '.object.type' "$response_file")
          while [[ "$object_type" == "tag" ]]; do
            status=$(fetch_ref "$api/tags/${object_sha}")
            if [[ "$status" != "200" ]]; then
              echo "::error::Could not resolve annotated tag $RELEASE_TAG (HTTP $status)."
              cat "$response_file"
              exit 1
            fi
            object_sha=$(jq -r '.object.sha' "$response_file")
            object_type=$(jq -r '.object.type' "$response_file")
          done

          if [[ "$object_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $RELEASE_TAG points to $object_sha, but this run built $GITHUB_SHA."
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Fission Server ${{ inputs.tag }}
          body: ${{ inputs.description }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          overwrite_files: true
          files: dist/*
