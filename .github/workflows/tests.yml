name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G
  CCACHE_COMPRESS: "true"
  CCACHE_NOHASHDIR: "true"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build

      - name: Cache CPM sources
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ github.job }}-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake', 'cmake/patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cpm-${{ runner.os }}-${{ github.job }}-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake', 'cmake/patches/**') }}-

      - name: Restore compiler cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-clang-${{ github.job }}-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-clang-${{ github.job }}-v2-
            ccache-${{ runner.os }}-clang-${{ github.job }}-

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DBUILD_TESTING=ON
          -DBUILD_FUZZING=OFF
          -DUSE_CCACHE=ON

      - name: Build tests
        run: cmake --build build --target Fission.Tests --parallel 2

      - name: Show compiler cache statistics
        run: ccache --cleanup && ccache --show-stats

      - name: Save CPM sources
        if: success() || failure()
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ github.job }}-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake', 'cmake/patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save compiler cache
        if: success() || failure()
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-clang-${{ github.job }}-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
